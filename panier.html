<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panier | NBA Paris Game 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=51">
</head>
<body data-page="cart">
  <header class="page-head">
    <div class="wrap">
      <p class="crumbs" data-i18n="cart.crumb">Commande</p>
      <h1 data-i18n="cart.h1">Votre panier.</h1>
    </div>
  </header>
  <main class="wrap cart-page">
    <section id="lignes"></section>
    <form class="cart-pay" id="commande">
      <p class="cart-kicker">Pelicans — Spurs</p>
      <h2 data-i18n="cart.who">Vos coordonnées</h2>
      <p class="cart-note" data-i18n="cart.note">Les billets sont nominatifs. La confirmation s’affiche à la fin de la commande.</p>
      <div class="form-row">
        <div>
          <label for="prenom" data-i18n="cart.first">Prénom</label>
          <input id="prenom" name="prenom" required autocomplete="given-name">
        </div>
        <div>
          <label for="nom" data-i18n="cart.last">Nom</label>
          <input id="nom" name="nom" required autocomplete="family-name">
        </div>
      </div>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="ville" data-i18n="cart.city">Ville</label>
      <input id="ville" name="ville" required autocomplete="address-level2">
      <div class="cart-sum">
        <span data-i18n="ok.total">Total</span>
        <strong data-cart-total>0 €</strong>
      </div>
      <p class="error" id="form-msg" role="status"></p>
      <button class="btn btn-red" type="submit" data-i18n="cart.pay">Payer</button>
    </form>
  </main>
  <script src="js/data.js"></script>
  <script src="js/i18n.js?v=12"></script>
  <script src="js/cart.js"></script>
  <script src="js/compte.js"></script>
  <script src="js/chrome.js?v=8"></script>
  <script>
    const zone = document.getElementById("lignes");
    const tarif = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
    const photos = {
      parquet: ["images/vues/rang-b.jpg?v=6", "68% 42%"],
      loges: ["images/vues/loges.jpg?v=6", "50% 48%"],
      boulevard: ["images/vues/boulevard.jpg?v=6", "58% 40%"],
      studio: ["images/vues/studio.jpg?v=6", "22% 42%"],
      seine: ["images/vues/seine.jpg?v=6", "22% 32%"],
      "grand-hall": ["images/vues/grand-hall.jpg?v=6", "12% 78%"]
    };

    function echapper(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function dessiner() {
      const { lignes, total } = detailPanier();
      const formulaire = document.getElementById("commande");
      if (!lignes.length) {
        zone.innerHTML = `<div class="cart-empty"><p>${t("cart.empty")}</p><a class="btn btn-light" href="billets.html">${t("cart.see")}</a></div>`;
        formulaire.hidden = true;
        return;
      }
      formulaire.hidden = false;
      zone.innerHTML = lignes.map((l) => {
        const [src, pos] = photos[l.id] || photos.seine;
        return `
          <article class="cart-ticket">
            <img src="${src}" alt="" style="object-position:${pos}">
            <div>
              <div class="cart-head">
                <div>
                  <p class="cart-tag">${echapper(l.tag)}</p>
                  <strong>${echapper(l.nom)}</strong>
                </div>
                <p class="cart-line-price">${tarif.format(l.sousTotal)}</p>
              </div>
              <p class="cart-unit">${tarif.format(l.prix)} ${t("home.per")}</p>
              <div class="qty" data-id="${l.id}">
                <button type="button" data-step="-1" aria-label="−">−</button>
                <span>${l.qte}</span>
                <button type="button" data-step="1" aria-label="+">+</button>
              </div>
            </div>
          </article>`;
      }).join("");
      document.querySelector("[data-cart-total]").textContent = tarif.format(total);
    }

    zone.addEventListener("click", (e) => {
      const step = e.target.closest("[data-step]");
      if (!step) return;
      const id = step.closest(".qty").dataset.id;
      const actuel = lirePanier()[id] || 0;
      definirQuantite(id, actuel + Number(step.dataset.step));
      dessiner();
    });

    document.getElementById("commande").addEventListener("submit", (e) => {
      e.preventDefault();
      const { lignes, total } = detailPanier();
      if (!lignes.length) return;
      const data = Object.fromEntries(new FormData(e.target));
      const numero = "PG27-" + Math.random().toString(36).slice(2, 8).toUpperCase();
      const commande = {
        numero,
        date: new Date().toISOString(),
        acheteur: data,
        lignes: lignes.map(({ id, nom, prix, qte, sousTotal }) => ({ id, nom, prix, qte, sousTotal })),
        total,
        match: MATCH
      };
      sessionStorage.setItem("paris-game-2027-commande", JSON.stringify(commande));
      const historique = JSON.parse(localStorage.getItem("paris-game-2027-commandes") || "[]");
      historique.push(commande);
      localStorage.setItem("paris-game-2027-commandes", JSON.stringify(historique));
      viderPanier();
      location.href = "confirmation.html";
    });

    dessiner();
    const compte = lireCompte();
    if (compte && lireSession() === compte.email) {
      const form = document.getElementById("commande");
      ["prenom", "nom", "email", "ville"].forEach((nom) => {
        if (form.elements[nom] && !form.elements[nom].value) form.elements[nom].value = compte[nom] || "";
      });
    }
    document.addEventListener("langue", dessiner);
  </script>
</body>
</html>
